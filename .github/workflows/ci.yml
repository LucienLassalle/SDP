name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # TODO : épingler une release fixe de SDP-Tests (vX.Y.Z) au lieu de main
  SDP_TESTS_REF: main

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.178.0

      - name: Run Semgrep
        run: semgrep scan --config auto --error --sarif-output=semgrep.sarif .

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

  tests:
    name: Tests
    needs: semgrep
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ci
      SDP_IMAGE: ghcr.io/lucienlassalle/sdp:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: sdp

      - name: Check out SDP-Tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LucienLassalle/SDP-Tests
          ref: ${{ env.SDP_TESTS_REF }}
          persist-credentials: false
          path: sdp-tests

      - name: Version de SDP-Tests
        working-directory: sdp-tests
        run: |
          echo "::warning::SDP-Tests utilisé depuis la branche $SDP_TESTS_REF ($(git rev-parse --short HEAD)) ; des releases fixes seront utilisées à terme"
          echo "SDP-Tests : \`$SDP_TESTS_REF\` @ \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install -r sdp-tests/requirements.txt

      - name: Build Docker images
        working-directory: sdp
        run: SESSION_SECRET=unused docker compose build

      - name: Analyses statiques (Trivy, systemd)
        working-directory: sdp-tests
        env:
          SDP_SRC: ${{ github.workspace }}/sdp
        run: pytest -m static

      - name: Démarrage de l'application
        working-directory: sdp
        run: |
          SESSION_SECRET=$(openssl rand -hex 32)
          export SESSION_SECRET
          # Secret Docker : lisible par les utilisateurs mysql et node des conteneurs
          install -d -m 0700 secrets
          (umask 022 && openssl rand -hex 32 > secrets/db_password)
          docker compose up -d --no-build --wait --wait-timeout 120
          # Certificat autosigné généré par le service tls, pour que les tests le vérifient
          docker compose run --rm --no-deps --entrypoint cat tls /tls/cert.pem > "$RUNNER_TEMP/sdp-ca.pem"

      - name: Tests fonctionnels
        working-directory: sdp-tests
        env:
          SDP_URL: https://localhost
        run: REQUESTS_CA_BUNDLE="$RUNNER_TEMP/sdp-ca.pem" pytest -m functional

      - name: Logs de l'application
        if: failure()
        working-directory: sdp
        run: SESSION_SECRET=unused docker compose logs

      - name: Arrêt de l'application
        if: always()
        working-directory: sdp
        run: SESSION_SECRET=unused docker compose down -v
