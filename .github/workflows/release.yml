name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build & push (GHCR)
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Vérification de la release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag $TAG invalide, format attendu : vX.Y.Z ou vX.Y.Z-suffixe (ex : v0.0.2-beta)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le commit de la release $TAG n'est pas sur main"
            exit 1
          fi

      - name: Build et push (tag = version de la release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # $1 = suffixe du nom de l'image, $2 = dossier du Dockerfile
          publish() {
            image="ghcr.io/${GITHUB_REPOSITORY,,}$1:${TAG}"
            docker build -t "$image" "$2"
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            echo "Image publiée : \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          }
          publish "" .
          publish -db db

  sbom:
    name: SBOM
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (code)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-code-${{ github.event.release.tag_name }}.spdx.json

      - name: Build Docker image
        run: docker build -t sdp:${{ github.sha }} .

      - name: Anchore SBOM Action (image Docker)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: sdp:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-image-${{ github.event.release.tag_name }}.spdx.json
