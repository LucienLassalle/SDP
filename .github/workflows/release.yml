name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Anchore SBOM Action (code)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-code-${{ github.event.release.tag_name }}.spdx.json

      - name: Build Docker image
        run: docker build -t sdp:${{ github.sha }} .

      - name: Anchore SBOM Action (image Docker)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: sdp:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-image-${{ github.event.release.tag_name }}.spdx.json
