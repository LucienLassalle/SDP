services:
  web:
    build: .
    image: ghcr.io/lucienlassalle/sdp:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "3000:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - DB_HOST=db
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  db:
    build: ./db
    image: ghcr.io/lucienlassalle/sdp-db:${IMAGE_TAG:-dev}
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: forum
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend

networks:
  frontend:
  # Réseau sans accès extérieur : seule l'application parle à la base
  backend:
    internal: true

volumes:
  db-data:
