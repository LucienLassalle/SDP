services:
  web:
    build: .
    image: ghcr.io/lucienlassalle/sdp:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:3443"
    mem_limit: 256m
    pids_limit: 200
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - DB_HOST=db
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
    volumes:
      # Certificat créé par le service tls, hors de l'image
      - tls:/run/tls:ro
    depends_on:
      tls:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # Génère le certificat autosigné (s'il manque ou expire bientôt) puis s'arrête
  tls:
    build: ./tls
    image: ghcr.io/lucienlassalle/sdp-tls:${IMAGE_TAG:-dev}
    restart: "no"
    network_mode: none
    mem_limit: 64m
    pids_limit: 20
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TLS_SAN=${TLS_SAN:-DNS:localhost,IP:127.0.0.1}
    volumes:
      - tls:/tls

  db:
    build: ./db
    image: ghcr.io/lucienlassalle/sdp-db:${IMAGE_TAG:-dev}
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 200
    read_only: true
    # Seuls les fichiers temporaires et le socket MySQL sont inscriptibles (+ le volume de données)
    tmpfs:
      - /tmp
      - /var/run/mysqld
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: forum
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend

networks:
  frontend:
  # Réseau sans accès extérieur : seule l'application parle à la base
  backend:
    internal: true

volumes:
  db-data:
  tls:
